name: Build Flutter Android APK

on:
  push:
    branches: [ flutter-v2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare Signing Keystore
        run: |
          mkdir -p android/app
          cp youjuapp.keystore android/app/youjuapp.keystore
          ls -lh android/app/youjuapp.keystore

      - name: Build Android Release APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g' | cut -d'+' -f1 | tr -d ' \r\n')
          BUILD_NUM=$(grep '^version:' pubspec.yaml | sed 's/version: //g' | cut -d'+' -f2 | tr -d ' \r\n')
          echo "Building signed Release APK with version $VERSION+$BUILD_NUM..."
          flutter build apk --release --build-name="$VERSION" --build-number="$BUILD_NUM"
          
          mkdir -p release_out
          cp build/app/outputs/flutter-apk/app-release.apk "release_out/youjuAPP_v${VERSION}.apk"
          echo "Release APK generated successfully:"
          ls -lh "release_out/youjuAPP_v${VERSION}.apk"
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youjuAPP-flutter-${{ env.APP_VERSION }}
          path: release_out/youjuAPP_v*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ env.APP_VERSION }}"
          RELEASE_TITLE="youjuAPP Flutter ${{ env.APP_VERSION }} Release"
          RELEASE_NOTES="youjuAPP ${{ env.APP_VERSION }} 发布：\n1. 恢复原版 uni-app 高清蓝牙遥控器 Logo 图标（含 mipmap 全规格与圆形图标规范）\n2. 全局 ThemeData 屏蔽水波纹与点击灰色遮罩（NoSplash 与透明高亮），确保 Tab 切换纯净无残影\n3. 支持经典蓝牙 SPP 与下位机 NCU/TCU 协议闭环"

          if gh release view "$TAG" -R ${{ github.repository }} >/dev/null 2>&1; then
            echo "Release $TAG exists, updating assets..."
            gh release upload "$TAG" release_out/youjuAPP_v${{ env.APP_VERSION }}.apk --clobber -R ${{ github.repository }}
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release_out/youjuAPP_v${{ env.APP_VERSION }}.apk \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              -R ${{ github.repository }}
          fi
