name: Build Flutter Android APK

on:
  push:
    branches: [ flutter-v2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          echo "Building signed Release APK with version 2.0.0+2000..."
          flutter build apk --release --build-name=2.0.0 --build-number=2000
          
          mkdir -p release_out
          cp build/app/outputs/flutter-apk/app-release.apk release_out/youjuAPP_v2.0.0.apk
          echo "Release APK generated successfully:"
          ls -lh release_out/youjuAPP_v2.0.0.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youjuAPP-flutter-v2.0.0
          path: release_out/youjuAPP_v2.0.0.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release v2.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.0.0"
          RELEASE_TITLE="youjuAPP Flutter 2.0.0 Release"
          RELEASE_NOTES="youjuAPP 2.0.0 重大架构升级 (Flutter Material 3 原生版本) - 120Hz丝滑手势、FlClash质感UI、工业级蓝牙与TCU全功能对齐"

          if gh release view "$TAG" -R ${{ github.repository }} >/dev/null 2>&1; then
            echo "Release $TAG exists, updating assets..."
            gh release upload "$TAG" release_out/youjuAPP_v2.0.0.apk --clobber -R ${{ github.repository }}
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release_out/youjuAPP_v2.0.0.apk \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              -R ${{ github.repository }}
          fi
