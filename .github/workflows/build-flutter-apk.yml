name: Build Flutter Android APK

on:
  push:
    branches: [ flutter-v2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          echo "Building signed Release APK with version 2.0.0+2000..."
          flutter build apk --release --build-name=2.0.0 --build-number=2000
          
          mkdir -p release_out
          cp build/app/outputs/flutter-apk/app-release.apk release_out/youjuAPP_v2.0.0.apk
          echo "Release APK generated successfully:"
          ls -lh release_out/youjuAPP_v2.0.0.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youjuAPP-flutter-v2.0.0
          path: release_out/youjuAPP_v2.0.0.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release v2.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.0.0"
          RELEASE_TITLE="youjuAPP Flutter 2.0.0 Release"
          RELEASE_NOTES="youjuAPP 2.0.0 重大架构升级 (Flutter Material 3 纯原生 Android 版本)
- 架构重构：基于 Flutter 3 + Material 3 自绘引擎，彻底解决手势冲突与滚动锁死，带来 120Hz 满帧丝滑体验
- 现代 UI：参考 FlClash 现代高品质卡片化交互、状态胶囊徽章与沉浸底栏
- 工业级蓝牙：接入 flutter_blue_plus，支持 Android 12+ 动态权限、毫秒级平滑 RSSI 监测与连接管理
- 完备功能对齐：天文参数、组件参数、保护参数、东西限位角与整体控制面板（10 种群控动作）100% 具备
- 官方永久签名：集成 youjuapp.keystore 官方签名，支持无缝覆盖升级"

          if gh release view "$TAG" -R ${{ github.repository }} >/dev/null 2>&1; then
            echo "Release $TAG exists, updating assets..."
            gh release upload "$TAG" release_out/youjuAPP_v2.0.0.apk --clobber -R ${{ github.repository }}
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release_out/youjuAPP_v2.0.0.apk \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              -R ${{ github.repository }}
          fi
