name: Build Flutter Android APK

on:
  push:
    branches: [ flutter-v2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare Signing Keystore
        run: |
          mkdir -p android/app
          cp youjuapp.keystore android/app/youjuapp.keystore
          ls -lh android/app/youjuapp.keystore

      - name: Build Android Release APK
        run: |
          echo "Building signed Release APK with version 2.1.1+2110..."
          flutter build apk --release --build-name=2.1.1 --build-number=2110
          
          mkdir -p release_out
          cp build/app/outputs/flutter-apk/app-release.apk release_out/youjuAPP_v2.1.1.apk
          echo "Release APK generated successfully:"
          ls -lh release_out/youjuAPP_v2.1.1.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youjuAPP-flutter-v2.1.1
          path: release_out/youjuAPP_v2.1.1.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release v2.1.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.1.1"
          RELEASE_TITLE="youjuAPP Flutter 2.1.1 Release (系统蓝牙开启授权与Tab动效打磨)"
          RELEASE_NOTES="youjuAPP 2.1.1 体验优化与交互修复：\n1. 修复手机未开蓝牙时直接显示正在搜索的问题，新增原生系统开启蓝牙授权弹窗（ACTION_REQUEST_ENABLE）与前置状态拦截\n2. 彻底修复底部 4 个导航 Tab 切换时出现的灰色圆角矩形残留与闪烁问题，改为纯净平滑的 Material 3 胶囊指示动效\n3. 优化双模蓝牙扫描链路与生命周期管理"

          if gh release view "$TAG" -R ${{ github.repository }} >/dev/null 2>&1; then
            echo "Release $TAG exists, updating assets..."
            gh release upload "$TAG" release_out/youjuAPP_v2.1.1.apk --clobber -R ${{ github.repository }}
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release_out/youjuAPP_v2.1.1.apk \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              -R ${{ github.repository }}
          fi
