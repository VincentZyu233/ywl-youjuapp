name: Build Flutter Android APK

on:
  push:
    branches: [ flutter-v2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare Signing Keystore
        run: |
          mkdir -p android/app
          cp youjuapp.keystore android/app/youjuapp.keystore
          ls -lh android/app/youjuapp.keystore

      - name: Build Android Release APK
        run: |
          echo "Building signed Release APK with version 2.1.0+2100..."
          flutter build apk --release --build-name=2.1.0 --build-number=2100
          
          mkdir -p release_out
          cp build/app/outputs/flutter-apk/app-release.apk release_out/youjuAPP_v2.1.0.apk
          echo "Release APK generated successfully:"
          ls -lh release_out/youjuAPP_v2.1.0.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youjuAPP-flutter-v2.1.0
          path: release_out/youjuAPP_v2.1.0.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release v2.1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.1.0"
          RELEASE_TITLE="youjuAPP Flutter 2.1.0 Release (经典蓝牙SPP与NCU协议升级版)"
          RELEASE_NOTES="youjuAPP 2.1.0 重大更新：\n1. 支持经典蓝牙 SPP (HC-05 / JDY-31-SPP) 原生驱动，彻底解决设备搜不到、连不上的问题\n2. 落地官方交接协议：实现 CRLF (\\r\\n) 分帧的 UTF-8 JSON 遥测与 10 项标准控制指令\n3. Material 3 现代质感 UI：5台 TCU 独立状态大盘、实时通信报文控制台、双模蓝牙秒连"

          if gh release view "$TAG" -R ${{ github.repository }} >/dev/null 2>&1; then
            echo "Release $TAG exists, updating assets..."
            gh release upload "$TAG" release_out/youjuAPP_v2.1.0.apk --clobber -R ${{ github.repository }}
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release_out/youjuAPP_v2.1.0.apk \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              -R ${{ github.repository }}
          fi
