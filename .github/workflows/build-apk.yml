name: Build Android APK & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (leave empty for auto v1.0.X)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Download & Setup HBuilderX Linux CLI
        run: |
          echo "Fetching latest HBuilderX download URL..."
          HX_URL=$(curl -sSL "https://download1.dcloud.net.cn/hbuilderx/release.json" | jq -r '.files[] | select(.code=="linux_full_x64") | .path')
          echo "Downloading from: $HX_URL"
          curl -L -o hx.tar.gz "$HX_URL"
          tar -zxf hx.tar.gz
          echo "$(pwd)/HBuilderX" >> $GITHUB_PATH

      - name: Start HBuilderX & Login
        env:
          DCLOUD_USER: ${{ secrets.DCLOUD_USERNAME }}
          DCLOUD_PASS: ${{ secrets.DCLOUD_PASSWORD }}
        run: |
          ./HBuilderX/cli open
          if [ -n "$DCLOUD_USER" ] && [ -n "$DCLOUD_PASS" ]; then
            echo "Logging into DCloud account..."
            ./HBuilderX/cli user login --username "$DCLOUD_USER" --password "$DCLOUD_PASS"
          else
            echo "::warning::DCLOUD_USERNAME or DCLOUD_PASSWORD secret is not configured in repository settings."
          fi

      - name: Submit & Build APK
        run: |
          ./HBuilderX/cli project open --path "$(pwd)"
          ./HBuilderX/cli pack --config pack.json

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youjuAPP-apk
          path: |
            unpackage/release/apk/*.apk
            dist/**/*.apk

      - name: Publish to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || format('v1.0.{0}', github.run_number) }}
          name: ${{ format('youjuAPP Build #{0}', github.run_number) }}
          draft: false
          prerelease: false
          files: |
            unpackage/release/apk/*.apk
            dist/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
