name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python AXML Tool
        run: pip install pyaxml

      - name: Setup Android Build Tools
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Found Android Build Tools at: $BUILD_TOOLS_DIR"
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          which zipalign || echo "zipalign not in path yet, added"
          which apksigner || echo "apksigner not in path yet, added"

      - name: Install dependencies
        run: npm install

      - name: Download & Setup HBuilderX Linux CLI
        run: |
          echo "Fetching latest HBuilderX download URL..."
          HX_URL=$(curl -sSL "https://download1.dcloud.net.cn/hbuilderx/release.json" | jq -r '.files[] | select(.code=="linux_full_x64") | .path')
          echo "Downloading from: $HX_URL"
          curl -L -o hx.tar.gz "$HX_URL"
          tar -zxf hx.tar.gz
          echo "$(pwd)/HBuilderX" >> $GITHUB_PATH

      - name: Start HBuilderX & Login
        env:
          DCLOUD_USER: ${{ secrets.DCLOUD_USERNAME }}
          DCLOUD_PASS: ${{ secrets.DCLOUD_PASSWORD }}
        run: |
          ./HBuilderX/cli open
          if [ -n "$DCLOUD_USER" ] && [ -n "$DCLOUD_PASS" ]; then
            echo "Logging into DCloud account..."
            ./HBuilderX/cli user login --username "$DCLOUD_USER" --password "$DCLOUD_PASS" || true
          fi

      - name: Download Base APK from previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p base_apk
          echo "Downloading base APK from release v1.0.13..."
          gh release download v1.0.13 --pattern "*.apk" --dir base_apk -R ${{ github.repository }} || true
          if [ ! -f "base_apk/youjuAPP_release.apk" ]; then
            echo "Base APK not found in v1.0.13, checking other releases..."
            gh release download --pattern "*.apk" --dir base_apk -R ${{ github.repository }} || true
          fi
          ls -lh base_apk/

      - name: Build App Resources & Package APK
        run: |
          mkdir -p unpackage/release/apk
          PROJECT_NAME=$(basename "$(pwd)")
          ./HBuilderX/cli project open --path "$(pwd)"

          # 1. 尝试导出本地离线打包资源 (appResource)
          echo "Exporting offline app resources..."
          EXPORT_OUTPUT=$(./HBuilderX/cli publish app-android --type appResource --project "$(pwd)" 2>&1 || true)
          echo "$EXPORT_OUTPUT"

          # 寻找导出的资源目录
          RES_DIR=""
          if [ -d "unpackage/resources/__UNI__CB17132" ]; then
            RES_DIR="unpackage/resources/__UNI__CB17132"
          elif [ -d "unpackage/resources" ]; then
            RES_DIR=$(find unpackage/resources -maxdepth 2 -type d -name "__UNI__*" | head -n 1)
          fi

          # 2. 如果存在基座且成功导出资源，优先执行高速离线注入签名打包
          BASE_APK=$(find base_apk -name "*.apk" | head -n 1)
          if [ -n "$RES_DIR" ] && [ -f "$BASE_APK" ]; then
            echo "Found resources at $RES_DIR and base APK at $BASE_APK"
            echo "Running fast offline APK repack & sign pipeline..."
            VERSION=$(node -e "console.log(require('./package.json').version)")
            VERSION_CODE=$(node -e "try { const m = JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log(m['app-plus']?.distribute?.google?.versionCode || m.versionCode || 1014); } catch(e) { console.log(1014); }")
            echo "Injecting Android version: $VERSION (code: $VERSION_CODE)"
            python3 scripts/build-offline.py \
              --base-apk "$BASE_APK" \
              --resource-dir "$RES_DIR" \
              --keystore youjuapp.keystore \
              --alias youjuapp \
              --password youjuapp2026 \
              --version-name "$VERSION" \
              --version-code "$VERSION_CODE" \
              --output unpackage/release/apk/youjuAPP.apk
          else
            echo "Falling back to standard cloud pack..."
            sed -i "s|\"certfile\": \".*\"|\"certfile\": \"$(pwd)/youjuapp.keystore\"|" pack.json
            sed -i "s/\"project\": \".*\"/\"project\": \"$PROJECT_NAME\"/" pack.json
            ./HBuilderX/cli pack cancel --project "$PROJECT_NAME" || true
            PACK_OUTPUT=$(./HBuilderX/cli pack --config pack.json 2>&1)
            echo "$PACK_OUTPUT"
            DOWNLOAD_URL=$(echo "$PACK_OUTPUT" | grep -oE "https?://[^ ]+download[^ ]+" | head -n 1)
            if [ -n "$DOWNLOAD_URL" ]; then
              curl -sSL "$DOWNLOAD_URL" -o unpackage/release/apk/youjuAPP.apk
            fi
          fi

          # 3. 校验最终产物
          if [ ! -f "unpackage/release/apk/youjuAPP.apk" ]; then
            echo "::error::Failed to generate release APK!"
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh unpackage/release/apk/youjuAPP.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youjuAPP-apk
          path: unpackage/release/apk/youjuAPP.apk
          if-no-files-found: error

      - name: Read Version & Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          TAG="v$VERSION"
          echo "Target Release Tag: $TAG"

          RELEASE_NOTES="自动化流水线构建正式版 APK (版本 $VERSION) - 修复设备列表平滑滚动与吸底按钮，升级离线打包"
          # 检查标签是否已存在，若存在则更新资产，若不存在则创建
          if gh release view "$TAG" -R ${{ github.repository }} >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading asset..."
            gh release upload "$TAG" unpackage/release/apk/youjuAPP.apk --clobber -R ${{ github.repository }}
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" unpackage/release/apk/youjuAPP.apk \
              --title "youjuAPP Build $TAG" \
              --notes "$RELEASE_NOTES" \
              -R ${{ github.repository }}
          fi
